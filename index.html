<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0f13; --card:#1c1c20; --blue:#4f6490; --stone:#adada4; --ink:#f3f1e7; --mute:#7f8189; --line:#2b2c32; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0e0f13; color: #f3f1e7; overflow: hidden;
    font-family: "JetBrains Mono", Menlo, "Courier New", monospace; }
  body { padding: 2.2vmin; display: flex; flex-direction: column; text-transform: uppercase; }

  /* Barre du haut */
  .topbar { display: flex; align-items: center; height: 8vmin; padding: 0 1vmin; flex: none; }
  .logo { width: 4.2vmin; display: flex; flex-wrap: wrap; margin-right: 2.4vmin; }
  .logo i { display: block; width: 0.8vmin; height: 0.8vmin; margin: 0.3vmin; background: #f3f1e7; }
  .sep { width: 1px; height: 4.6vmin; background: #2b2c32; margin: 0 2.6vmin; }
  .kv { margin-right: 3.2vmin; }
  .kv span { display: block; font-size: 1.35vmin; letter-spacing: 0.12em; color: #7f8189; }
  .kv b { display: block; font-size: 1.9vmin; font-weight: 400; margin-top: 0.5vmin; }
  .spacer { flex: 1; }
  .kv.right { margin-right: 0; text-align: right; }

  /* Grille */
  .grid { flex: 1; min-height: 0; display: grid; grid-gap: 1.4vmin;
    grid-template-columns: 1fr 1fr 1.7fr; grid-template-rows: 1fr 1.25fr 0.55fr;
    grid-template-areas: "clock clock news" "wx cd news" "wx date news"; }
  /* Le dernier bloc de chaque carte est poussé en bas ; en cas de manque de place, il déborde vers le bas,
     jamais par-dessus le titre. */
  .card { background: #1c1c20; padding: 2.6vmin; position: relative; overflow: hidden; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-start; }
  .card > :last-child { margin-top: auto; }
  /* Météo et New York : le contenu suit directement le titre au lieu d'être collé en bas */
  .c-wx > :last-child, .c-cd > :last-child { margin-top: 2.6vmin; }
  .card > .lbl, .card > .wx-top { margin-bottom: 1.4vmin; }
  .lbl { font-size: 1.65vmin; letter-spacing: 0.12em; color: #7f8189; }
  .card.blue { background: #4f6490; }
  .card.blue .lbl { color: rgba(243,241,231,0.72); }
  .card.stone { background: #adada4; color: #17181c; }
  .card.stone .lbl { color: rgba(23,24,28,0.6); }

  .c-clock { grid-area: clock; } .c-wx { grid-area: wx; } .c-cd { grid-area: cd; }
  .c-date { grid-area: date; } .c-news { grid-area: news; }

  #clock { font-size: 17vmin; font-weight: 300; line-height: 1; letter-spacing: -0.04em; }
  .row-end { display: flex; justify-content: space-between; align-items: flex-end; }
  .unit { font-size: 2vmin; color: rgba(243,241,231,0.72); letter-spacing: 0.1em; padding-bottom: 1.4vmin; }

  .wx-top { display: flex; justify-content: space-between; align-items: flex-start; }
  #wIcon { font-size: 4vmin; line-height: 1; text-transform: none; }
  #wTemp { font-size: 9.5vmin; font-weight: 300; line-height: 1; letter-spacing: -0.04em; }
  #wDesc { font-size: 1.9vmin; letter-spacing: 0.08em; margin-top: 1vmin; }
  #wMore { font-size: 1.45vmin; line-height: 1.7; color: #7f8189; margin-top: 0.8vmin; letter-spacing: 0.06em; }
  .days { display: flex; border-top: 1px solid #2b2c32; margin-top: 1.6vmin; padding-top: 1.4vmin; }
  .day { flex: 1; font-size: 1.35vmin; color: #7f8189; letter-spacing: 0.06em; }
  .day b { display: block; font-size: 2.6vmin; font-weight: 400; margin: 0.5vmin 0; text-transform: none; }

  #cdNum { font-size: 13vmin; font-weight: 300; line-height: 1; letter-spacing: -0.04em; }
  #cdTxt { font-size: 1.8vmin; letter-spacing: 0.08em; margin-top: 1vmin; line-height: 1.4; }
  #cdSub { font-size: 1.45vmin; color: #7f8189; margin-top: 1.4vmin; padding-top: 1.4vmin; border-top: 1px solid #2b2c32; letter-spacing: 0.06em; }

  #date { font-size: 3.4vmin; line-height: 1.1; letter-spacing: -0.01em; font-weight: 400; }
  #dateWeek { font-size: 1.65vmin; letter-spacing: 0.12em; color: rgba(23,24,28,0.6); }

  .c-news { padding-bottom: 1.6vmin; }
  #news { margin-top: 1.6vmin; flex: 1; min-height: 0; overflow: hidden; }
  .news-item { display: flex; padding: 1.7vmin 0; border-top: 1px solid #2b2c32; }
  .news-item:first-child { border-top: 0; padding-top: 0.4vmin; }
  .news-num { width: 4.6vmin; flex: none; font-size: 1.7vmin; color: #4f6490; padding-top: 0.5vmin; letter-spacing: 0.06em; }
  .news-title { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform: none;
    font-size: 2.45vmin; line-height: 1.25; }
  .news-src { font-size: 1.35vmin; letter-spacing: 0.1em; color: #7f8189; margin-top: 0.7vmin; }
  .news-item.clickable { cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.08); }
  .news-item.clickable:active .news-title { color: #8fa5d8; }
  .muted { color: #7f8189; font-size: 1.8vmin; line-height: 1.5; text-transform: none; }

  /* Lecteur d'article */
  #reader { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #0e0f13; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4vmin 6vmin 8vmin; }
  #reader .r-inner { max-width: 110vmin; margin: 0 auto; }
  #rClose { display: block; margin-left: auto; font-size: 2vmin; letter-spacing: 0.12em; text-transform: uppercase;
    color: #17181c; background: #adada4; border: 0; border-radius: 0; padding: 1.8vmin 3.4vmin; font-family: inherit; }
  #rSrc { font-size: 1.8vmin; letter-spacing: 0.12em; color: #8fa5d8; margin-top: 3vmin; }
  #rTitle { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform: none;
    font-size: 5vmin; font-weight: 600; line-height: 1.2; margin-top: 1.5vmin; }
  #rBody p { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform: none;
    font-size: 3.5vmin; line-height: 1.6; color: #d8dae0; margin-top: 3vmin; }
  #rLink { display: inline-block; margin-top: 4vmin; font-size: 2vmin; letter-spacing: 0.1em; color: #7f8189; }

  @media (orientation: portrait) {
    .grid { grid-template-columns: 1fr 1fr; grid-template-rows: 0.8fr 2.4fr 1.2fr 0.5fr;
      grid-template-areas: "clock clock" "news news" "wx cd" "wx date"; }
    #clock { font-size: 22vmin; }
    #wTemp { font-size: 12vmin; } #cdNum { font-size: 12vmin; }
    .news-title { font-size: 2.9vmin; } .news-num { font-size: 2vmin; } .news-src { font-size: 1.6vmin; }
    .lbl { font-size: 1.9vmin; } .kv span { font-size: 1.6vmin; } .kv b { font-size: 2.2vmin; }
    #wDesc { font-size: 2.2vmin; } #wMore, #cdSub, .day { font-size: 1.6vmin; } #cdTxt { font-size: 2vmin; }
    #date { font-size: 3.8vmin; } #dateWeek { font-size: 1.9vmin; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sep"></div>
  <div class="kv"><span>Paris</span><b id="tbTemp">--°</b></div>
  <div class="kv"><span>Pluie</span><b id="tbRain">--%</b></div>
  <div class="kv"><span>New York</span><b id="tbCd">J-—</b></div>
  <div class="sep"></div>
  <div class="kv"><span>Newsletter</span><b id="tbNews">—</b></div>
  <div class="spacer"></div>
  <div class="kv right"><span>Date</span><b id="tbDate">--.--.----</b></div>
</div>

<div class="grid">
  <div class="card blue c-clock">
    <div class="lbl">Heure · Paris</div>
    <div class="row-end"><div id="clock">--:--</div></div>
  </div>

  <div class="card c-wx">
    <div class="wx-top"><div class="lbl">Météo · Paris</div><div id="wIcon"></div></div>
    <div>
      <div id="wTemp">--°</div>
      <div id="wDesc">Chargement…</div>
      <div id="wMore"></div>
      <div class="days" id="wDays"></div>
    </div>
  </div>

  <div class="card c-cd">
    <div class="lbl">New York</div>
    <div>
      <div class="row-end"><div id="cdNum">--</div><div class="unit">JOURS</div></div>
      <div id="cdTxt"></div>
      <div id="cdSub">Départ mer. 2 décembre 2026</div>
    </div>
  </div>

  <div class="card stone c-date">
    <div class="wx-top"><div class="lbl">Aujourd’hui</div><div id="dateWeek"></div></div>
    <div id="date"></div>
  </div>

  <div class="card c-news">
    <div class="lbl" id="newsLabel">Newsletter</div>
    <div id="news"><div class="muted">Chargement…</div></div>
  </div>
</div>

<div id="reader">
  <div class="r-inner">
    <button id="rClose" type="button" onclick="closeReader()">Fermer ✕</button>
    <div id="rSrc"></div>
    <div id="rTitle"></div>
    <div id="rBody"></div>
    <a id="rLink" href="#" target="_blank" style="display:none">Ouvrir l'article complet ↗</a>
  </div>
</div>

<script>
/* ---- Réglages ---- */
var LAT = 48.8566, LON = 2.3522;           // Paris
var DEPART = new Date(2026, 11, 2);   // départ mer. 2 déc. 2026 (mois 0-indexé)
var RETOUR = new Date(2026, 11, 6);   // retour dim. 6 déc. 2026

/* ---- Utilitaires (JS volontairement simple, compatible iOS 12) ---- */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function getJSON(url, ok, ko) {
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) {
      try { ok(JSON.parse(x.responseText)); } catch (e) { ko(); }
    } else { ko(); }
  };
  x.send();
}

/* ---- Horloge + date + compte à rebours ---- */
function tick() {
  var d = new Date();
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('tbDate').textContent = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  var ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  document.getElementById('dateWeek').textContent = 'SEM. ' + Math.ceil(((t - ys) / 86400000 + 1) / 7);
  document.getElementById('date').textContent =
    JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];

  var today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var left = Math.round((DEPART - today) / 86400000);
  var back = Math.round((RETOUR - today) / 86400000);
  var num = document.getElementById('cdNum'), txt = document.getElementById('cdTxt'), sub = document.getElementById('cdSub');
  if (left > 1)        { num.textContent = left; txt.textContent = 'jours avant le départ'; }
  else if (left === 1) { num.textContent = 'J-1'; txt.textContent = 'valises et passeport prêts ?'; }
  else if (left === 0) { num.textContent = 'J-0'; txt.textContent = 'c\u2019est aujourd\u2019hui, bon vol !'; }
  else if (back > 0)   { num.textContent = back; txt.textContent = 'jours avant le retour'; sub.textContent = 'Retour dim. 6 décembre'; }
  else                 { num.textContent = '✓'; txt.textContent = 'Voyage terminé'; sub.textContent = ''; }
  document.getElementById('tbCd').textContent = left >= 0 ? 'J-' + left : (back > 0 ? 'R-' + back : '—');
}

/* ---- Météo (Open-Meteo, sans clé API) ---- */
var WMO = {
  0:['☀️','Ciel dégagé'], 1:['🌤️','Plutôt dégagé'], 2:['⛅','Partiellement nuageux'], 3:['☁️','Couvert'],
  45:['🌫️','Brouillard'], 48:['🌫️','Brouillard givrant'],
  51:['🌦️','Bruine légère'], 53:['🌦️','Bruine'], 55:['🌦️','Bruine dense'],
  61:['🌧️','Pluie faible'], 63:['🌧️','Pluie'], 65:['🌧️','Forte pluie'],
  66:['🌧️','Pluie verglaçante'], 67:['🌧️','Pluie verglaçante'],
  71:['🌨️','Neige faible'], 73:['🌨️','Neige'], 75:['❄️','Forte neige'], 77:['🌨️','Grésil'],
  80:['🌦️','Averses'], 81:['🌦️','Averses'], 82:['⛈️','Fortes averses'],
  85:['🌨️','Averses de neige'], 86:['🌨️','Averses de neige'],
  95:['⛈️','Orage'], 96:['⛈️','Orage et grêle'], 99:['⛈️','Orage et grêle']
};
function wmo(c) { return WMO[c] || ['🌡️', '—']; }

function loadWeather() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=Europe%2FParis&forecast_days=4';
  getJSON(url, function (w) {
    var c = w.current, d = w.daily, m = wmo(c.weather_code);
    document.getElementById('wIcon').textContent = m[0];
    document.getElementById('wTemp').textContent = Math.round(c.temperature_2m) + '°';
    document.getElementById('tbTemp').textContent = Math.round(c.temperature_2m) + '°';
    document.getElementById('tbRain').textContent = d.precipitation_probability_max[0] + '%';
    document.getElementById('wDesc').textContent = m[1];
    document.getElementById('wMore').innerHTML =
      'Ressenti ' + Math.round(c.apparent_temperature) + '° · Vent ' + Math.round(c.wind_speed_10m) + ' km/h<br>' +
      'Aujourd’hui ' + Math.round(d.temperature_2m_min[0]) + '° / ' + Math.round(d.temperature_2m_max[0]) +
      '° · Pluie ' + d.precipitation_probability_max[0] + ' %';
    var html = '';
    for (var i = 1; i < d.time.length; i++) {
      var dt = new Date(d.time[i] + 'T12:00:00');
      html += '<div class="day">' + JOURS[dt.getDay()].substr(0, 3) + '.<b>' + wmo(d.weather_code[i])[0] +
        '</b>' + Math.round(d.temperature_2m_min[i]) + '° / ' + Math.round(d.temperature_2m_max[i]) + '°</div>';
    }
    document.getElementById('wDays').innerHTML = html;
  }, function () {
    document.getElementById('wDesc').textContent = 'Météo indisponible';
  });
}

/* ---- Newsletter : lit newsletter.json (même dossier) ----
   Format attendu :
   { "title": "Matinale du 21 nov.", "items": [ { "title": "...", "source": "..." }, ... ] } */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
var NEWS = [];
function openReader(i) {
  var it = NEWS[i];
  if (!it) return;
  var paras = String(it.summary || '').split('\n'), body = '';
  for (var k = 0; k < paras.length; k++) {
    if (paras[k].replace(/\s/g, '')) body += '<p>' + esc(paras[k]) + '</p>';
  }
  document.getElementById('rSrc').textContent = it.source || '';
  document.getElementById('rTitle').textContent = it.title || '';
  document.getElementById('rBody').innerHTML = body;
  var link = document.getElementById('rLink');
  if (it.url && /^https?:\/\//.test(it.url)) { link.href = it.url; link.style.display = 'inline-block'; }
  else { link.style.display = 'none'; }
  var r = document.getElementById('reader');
  r.style.display = 'block';
  r.scrollTop = 0;
}
function closeReader() {
  document.getElementById('reader').style.display = 'none';
}
function loadNews() {
  getJSON('newsletter.json?t=' + new Date().getTime(), function (n) {
    if (n.title) document.getElementById('newsLabel').textContent = n.title;
    var items = n.items || [], html = '';
    NEWS = items;
    for (var i = 0; i < items.length && i < 6; i++) {
      var can = !!items[i].summary;
      html += '<div class="news-item' + (can ? ' clickable" onclick="openReader(' + i + ')' : '') + '">' +
        '<div class="news-num">' + pad(i + 1) + '</div><div class="news-body">' +
        '<div class="news-title">' + esc(items[i].title) + '</div>' +
        (items[i].source ? '<div class="news-src">' + esc(items[i].source) + '</div>' : '') + '</div></div>';
    }
    document.getElementById('tbNews').textContent = Math.min(items.length, 6) + ' ART.';
    document.getElementById('news').innerHTML = html || '<div class="muted">Aucun article.</div>';
  }, function () {
    document.getElementById('news').innerHTML =
      '<div class="muted">Pas encore de newsletter.json.<br>Ajoute-le dans le même dossier que cette page.</div>';
  });
}

/* ---- Lancement + rafraîchissements ---- */
tick(); loadWeather(); loadNews();
setInterval(tick, 1000);
setInterval(loadWeather, 15 * 60 * 1000);   // météo : toutes les 15 min
setInterval(loadNews, 30 * 60 * 1000);      // newsletter : toutes les 30 min

/* ---- Rechargement automatique : chaque nuit vers 4 h, pour récupérer les mises à jour de la page.
   Ne se déclenche pas si le lecteur d'article est ouvert, ni si la page vient d'être chargée. ---- */
var LOADED_AT = new Date().getTime();
setInterval(function () {
  var now = new Date();
  var readerOpen = document.getElementById('reader').style.display === 'block';
  if (now.getHours() === 4 && !readerOpen && now.getTime() - LOADED_AT > 2 * 3600 * 1000) {
    location.reload(true);
  }
}, 60 * 1000);
</script>
</body>
</html>
